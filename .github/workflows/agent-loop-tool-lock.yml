name: Agent Loop Tooling

on:
  pull_request:
    paths:
      - '.github/workflows/agent-loop-tool-lock.yml'
      - 'tools/agent-loop/composer.json'
      - 'tools/agent-loop/composer.lock'
      - 'bin/agent-loop'
      - 'AGENTS.md'
      - 'CLAUDE.md'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Validate isolated tool project
        run: composer validate --working-dir=tools/agent-loop --strict

      - name: Install locked isolated tool graph
        run: composer install --working-dir=tools/agent-loop --no-interaction --prefer-dist --no-progress

      - name: Smoke unified CLI
        run: bin/agent-loop help >/dev/null
